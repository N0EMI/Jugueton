<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de juguetes. Encuentra tu juguete favorito.">
  <title>El Juguetón | Catálogo de juguetes</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado-interior">
      <div class="marca-tienda">
        <img class="logo-tienda" src="img/logo-jugueton.jpeg" alt="Logo de El Juguetón">
        <div>
          <p class="sobre-titulo">DIVERSIÓN PARA TODOS</p>
          <h1>El Juguetón</h1>
          <p>Encuentra tu próximo juguete favorito</p>
        </div>
      </div>
      <a class="enlace-admin" href="admi.html">Administrar</a>
    </div>
  </header>

  <main class="contenedor">
    <section class="introduccion">
      <h2>Nuestros juguetes</h2>
      <p>Explora el catálogo y consulta disponibilidad por WhatsApp.</p>
    </section>

    <section class="filtros" aria-label="Buscar juguetes">
      <label class="solo-lectores" for="buscar">Buscar productos</label>
      <input id="buscar" type="search" placeholder="¿Qué juguete estás buscando?" autocomplete="off">
      <div id="categorias" class="categorias"></div>
      <div id="modelos-contenedor" class="modelos-contenedor" hidden>
        <p class="titulo-modelos">Modelos</p>
        <div id="modelos" class="categorias modelos"></div>
      </div>
    </section>

    <p id="estado-catalogo" class="mensaje" aria-live="polite">Cargando productos...</p>
    <section id="productos" class="productos" aria-live="polite"></section>
    <nav id="paginacion" class="paginacion" aria-label="Páginas del catálogo"></nav>
  </main>

  <dialog id="modal-producto" class="modal-producto" aria-labelledby="modal-nombre">
    <div class="modal-contenido">
      <button id="cerrar-modal" class="modal-cerrar" type="button" aria-label="Cerrar">×</button>
      <div id="modal-galeria" class="modal-galeria">
        <button id="foto-anterior" class="flecha-foto" type="button" aria-label="Fotografía anterior">‹</button>
        <img id="modal-imagen" alt="Fotografía del producto">
        <button id="foto-siguiente" class="flecha-foto" type="button" aria-label="Fotografía siguiente">›</button>
      </div>
      <p id="modal-contador" class="modal-contador"></p>
      <h2 id="modal-nombre"></h2>
      <p id="modal-categoria" class="descripcion"></p>
      <p id="modal-codigo" class="descripcion"></p>
      <p id="modal-descripcion" class="modal-descripcion"></p>
      <p id="modal-precio" class="precio"></p>
      <a id="modal-whatsapp" class="boton-whatsapp" target="_blank" rel="noopener noreferrer">Consultar por WhatsApp</a>
    </div>
  </dialog>

  <footer class="pie">
    <p>© 2026 Juguetón · Todos los derechos reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/conexion.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
